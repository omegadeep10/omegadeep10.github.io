<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deep Patel. Get in touch.">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Deep Patel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d3530'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23f5f3ed'%3ED%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light dark; --paper: #f5f3ed; --ink: #2d3530; --muted: #59615b; --accent: #916242; --line: #d7dad1; }
    * { box-sizing: border-box; }
    html { min-width: 240px; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 540px); padding: clamp(28px, 7vw, 56px) 0; }
    .mark { width: 36px; height: 3px; margin-bottom: 36px; background: var(--accent); }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 11vw, 80px); line-height: 1.08; font-weight: 400; letter-spacing: -0.045em; }
    address { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); font-style: normal; }
    a { display: inline-flex; align-items: center; gap: 18px; min-height: 44px; max-width: 100%; color: var(--muted); font-size: 17px; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
    a:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 7px; border-radius: 2px; }
    .arrow { flex: none; font-size: 22px; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #202622; --ink: #f1efe7; --muted: #c2c9c0; --accent: #c69a77; --line: #414b43; }
    }
    @media print {
      :root { --paper: white; --ink: black; --muted: black; --accent: black; --line: #bbb; }
      body { min-height: auto; display: block; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="name">
    <div class="mark" aria-hidden="true"></div>
    <h1 id="name">Deep Patel</h1>
    <address>
      <a href="mailto:hello@deeppatel.me"><span>hello@deeppatel.me</span><span class="arrow" aria-hidden="true">↗</span></a>
    </address>
  </main>
</body>
</html>
